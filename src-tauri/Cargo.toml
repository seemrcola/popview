[package]
name = "popview"
version = "0.1.0"
description = "A playful local image viewer"
authors = ["PopView"]
edition = "2021"

[lib]
name = "popview_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }

[dependencies]
tauri = { version = "2.8.1", features = [] }
tauri-plugin-dialog = "2.4.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp"] }
percent-encoding = "2"
sha2 = "0.10"
tokio = { version = "1", features = ["sync"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSWindow", "NSView", "NSButton", "NSResponder", "NSControl"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFArray", "CFData", "CFDictionary", "CFNumber", "CFString", "CFURL"] }
objc2-image-io = { version = "0.3.2", default-features = false, features = ["std", "CGImageSource", "CGImageDestination", "CGImageProperties", "objc2-core-graphics"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
